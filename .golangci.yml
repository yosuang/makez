version: "2"

run:
  timeout: 10m

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax

  settings:
    gofmt:
      simplify: true

linters:
  default: none

  enable:
    - dupl
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - thelper
    - unused
    - usestdlibvars
    - usetesting

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
