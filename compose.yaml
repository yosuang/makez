name: makez

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: makez
      POSTGRES_PASSWORD: makez-local
      POSTGRES_DB: makez
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makez -d makez"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:1.9.1
    # Existing SQLite files and their directory belong to the host user.
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:17233:7233"
      - "127.0.0.1:18233:8233"
    volumes:
      - ./.local/temporal:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  opensandbox:
    image: opensandbox/server:release-1.1.1
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${MAKEZ_SANDBOX_API_KEY:?Run make dev once, then source .local/env}
    ports:
      - "127.0.0.1:18080:8080"
    configs:
      - source: opensandbox
        target: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.local/opensandbox:/data
    networks:
      - sandboxes
    healthcheck:
      # The upstream image includes Python, but no curl or wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

configs:
  opensandbox:
    file: ./build/opensandbox.toml

volumes:
  postgres:
    name: makez-postgres
    external: true

networks:
  sandboxes:
    name: makez-sandboxes
