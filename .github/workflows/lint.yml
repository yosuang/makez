name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: makez_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAKEZ_TEST_DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/makez_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run fmt-check
      - run: mise run sqlc-check
      - run: mise run swagger-check
      - run: go build ./...
      - run: go vet ./...
      - run: mise run test-pg
      - run: go test -race ./...
      - run: mise use --global node@24.19.0 pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web check
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: MAKEZ_BROWSER_TEST=1 go test ./internal/api -run TestBrowserSessionJourney -count=1 -timeout=3m
