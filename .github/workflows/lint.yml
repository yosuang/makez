name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run fmt-check
      - run: mise run sqlc-check
      - run: mise run swagger-check

  # mise run test-pg is the integration target. This job gives it PostgreSQL 17.11,
  # the same major image as deploy/docker-compose.infra.yaml, and fails if the
  # database tests skip. The host port is 15432, outside the kernel ephemeral
  # range 32768–60999. Port 55432 is inside that range, and Docker binds the
  # service before any step can run. Compose keeps 55432.
  # TestBrowserSessionJourney still skips: it needs MAKEZ_BROWSER_TEST=1 and
  # Chromium, which this job does not install.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: makez
          POSTGRES_PASSWORD: makez-local
          POSTGRES_DB: makez
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U makez -d makez"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run test-pg
        env:
          MAKEZ_TEST_DATABASE_URL: postgres://makez:makez-local@127.0.0.1:15432/makez?sslmode=disable
